<!doctype html>
<html><head><meta charset="utf-8"><title>Emuly social preview</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { background: #0f1828; color: #e8edf6; font-family: "Segoe UI", Inter, system-ui, sans-serif; position: relative; }
  .glow { position: absolute; right: -180px; top: -200px; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, #3159bf66 0%, #3159bf00 62%); }
  .grid { position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px);
    background-size: 40px 40px; mask-image: linear-gradient(90deg, transparent 0%, #000 55%, #000 100%); }
  .left { position: absolute; left: 88px; top: 72px; bottom: 72px; width: 720px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 36px; font-weight: 700; letter-spacing: -.5px; }
  h1 { font-size: 76px; line-height: 1.02; letter-spacing: -2.5px; font-weight: 800; }
  h1 em { font-style: normal; color: #a9bfff; }
  .sub { margin-top: 22px; font-size: 26px; color: #9aabc4; line-height: 1.4; }
  .prompt { margin-top: 26px; display: inline-flex; align-items: center; gap: 12px; padding: 12px 18px; border-radius: 12px;
    background: #0a1220; border: 1px solid #2a3a55; font: 20px "Cascadia Code", Consolas, monospace; color: #c9d6ee; width: fit-content; }
  .prompt b { color: #7ee2a8; font-weight: 400; }
  .agents { display: flex; align-items: center; gap: 18px; color: #7d8fab; font-size: 16px; letter-spacing: 2px; font-weight: 600; }
  .agents img { height: 26px; width: 26px; object-fit: contain; }
  .logos { display: flex; gap: 16px; align-items: center; }
  .phone { position: absolute; right: 120px; top: 50%; transform: translateY(-50%) rotate(4deg); width: 280px; height: 560px;
    border-radius: 48px; padding: 13px; background: #0a1220; border: 2px solid #4a5f7e;
    box-shadow: 0 50px 100px #02060dcc, 0 0 0 8px #ffffff05; }
  .screen { position: relative; height: 100%; border-radius: 36px; overflow: hidden; display: flex; flex-direction: column; align-items: center;
    background: linear-gradient(160deg, #5a82e6 0%, #3159bf 55%, #1f3c82 100%); }
  .cam { width: 14px; height: 14px; border-radius: 50%; background: #0a1220; margin-top: 14px; }
  .time { font-size: 70px; font-weight: 300; margin-top: 64px; color: #fff; letter-spacing: -1px; }
  .status { margin-top: 6px; font-size: 17px; color: #e0e9ff; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #7ee2a8; box-shadow: 0 0 10px #7ee2a8; }
  .apps { position: absolute; bottom: 46px; display: grid; grid-template-columns: repeat(4, 38px); gap: 18px; }
  .apps i { width: 38px; height: 38px; border-radius: 12px; background: #ffffff33; }
  .badge { position: absolute; right: 60px; bottom: 70px; padding: 10px 16px; border-radius: 999px; background: #121e33ee;
    border: 1px solid #2f4466; font-size: 17px; color: #c9d6ee; display: flex; gap: 8px; align-items: center; transform: rotate(4deg); }
</style></head>
<body>
  <div class="glow"></div><div class="grid"></div>
  <div class="left">
    <div class="brand">
      <svg width="56" height="56" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#3159bf"/>
        <rect x="20" y="9" width="24" height="46" rx="7" fill="none" stroke="#fff" stroke-width="5"/>
        <rect x="27" y="44" width="10" height="4" rx="2" fill="#fff"/></svg>
      Emuly
    </div>
    <div>
      <h1>Android emulator<br>in the cloud. <em>Free.</em></h1>
      <p class="sub">Runs in your own GitHub Codespace.<br>Your coding agent drives it over HTTP.</p>
      <div class="prompt"><b>❯</b> start an Android phone and test my app</div>
    </div>
    <div class="agents">WORKS WITH
      <div class="logos">
        <img src="../public/agents/claude-ai-icon.svg"><img src="../public/agents/openai_dark.svg">
        <img src="../public/agents/cursor_dark.svg"><img src="../public/agents/gemini.svg">
        <img src="../public/agents/copilot_dark.svg"><img src="../public/agents/windsurf-dark.svg">
        <img src="../public/agents/opencode-dark.svg"><img src="../public/agents/cline-dark.svg">
      </div>
    </div>
  </div>
  <div class="phone"><div class="screen">
    <div class="cam"></div><div class="time">9:41</div>
    <div class="status"><span class="dot"></span>Ready</div>
    <div class="apps"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div></div>
</body></html>
