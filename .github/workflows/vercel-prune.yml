# Keep only the current production deployment of the Emuly Vercel project.
# Why: Vercel keeps the last 10 production deployments, and each one counts toward the
# 10 GB Function Storage of the free plan. Git has every commit, so a redeploy replaces a rollback.
# Needs the repo secret VERCEL_TOKEN. Without it, this job does nothing.
name: Prune old Vercel deployments

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-prune
  cancel-in-progress: true

permissions: {}

jobs:
  prune:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: arnab-mondals-projects
      PROJECT: emuly
    steps:
      - name: Delete every production deployment except the current one
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then echo "No VERCEL_TOKEN secret; skip."; exit 0; fi
          api() { curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$@"; }
          project=$(api "https://api.vercel.com/v9/projects/$PROJECT?slug=$TEAM" | jq -r .id)
          # Keep the newest READY production deployment: it serves the site. Vercel can point the
          # production target at a build that is not ready yet, so do not trust that field.
          # On a push, first wait until Vercel's build of this commit is READY (Vercel makes no GitHub deployments here).
          if [ "${{ github.event_name }}" = push ]; then
            for i in $(seq 60); do
              state=$(api "https://api.vercel.com/v6/deployments?slug=$TEAM&projectId=$project&target=production&limit=20"                 | jq -r --arg sha "$GITHUB_SHA" '[.deployments[] | select(.meta.githubCommitSha == $sha)][0].state // "NONE"')
              [ "$state" = READY ] && break
              [ "$state" = ERROR ] || [ "$state" = CANCELED ] && { echo "Build $state; skip."; exit 0; }
              sleep 10
            done
            [ "$state" = READY ] || { echo "Build not ready after 10 min; skip."; exit 0; }
          fi
          list=$(api "https://api.vercel.com/v6/deployments?slug=$TEAM&projectId=$project&target=production&state=READY&limit=100")
          ids=$(echo "$list" | jq -r '.deployments | sort_by(-.created) | .[1:][] | .uid')
          for id in $ids; do
            api -X DELETE "https://api.vercel.com/v13/deployments/$id?slug=$TEAM" > /dev/null && echo "deleted $id"
          done
